<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Off-ken | Active Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --offken-green: #76bc21; --offken-navy: #0f172a; --offken-orange: #f3a107; }
    .bg-offken-green { background-color: var(--offken-green); }
    .text-offken-green { color: var(--offken-green); }
    .shinko-dark { background: var(--offken-navy); }

    .pulse-container {
      position: absolute;
      width: 100%; height: 100%;
      display: flex; justify-content: center; align-items: center;
      z-index: 1; overflow: hidden; pointer-events: none;
    }
    .ring {
      position: absolute; border: 4px solid var(--offken-green);
      border-radius: 50%; animation: ripple 4s infinite ease-out; opacity: 0;
    }
    .ring:nth-child(2) { animation-delay: 1s; }
    .ring:nth-child(3) { animation-delay: 2s; }
    @keyframes ripple {
      0% { width: 100px; height: 100px; opacity: 0.6; }
      100% { width: 160vh; height: 160vh; opacity: 0; }
    }
    @keyframes scan { 0% { top: 0%; } 50% { top: 100%; } 100% { top: 0%; } }
    #reader video { object-fit: cover !important; width: 100% !important; height: 100% !important; }
  </style>
</head>
<body class="shinko-dark h-screen w-screen flex flex-col font-sans overflow-hidden text-white">
  
  <div class="pulse-container">
    <div class="ring"></div><div class="ring"></div><div class="ring"></div>
  </div>

  <header class="h-[12vh] flex justify-center items-center z-50 bg-white/5 backdrop-blur-xl border-b border-white/10 shrink-0 px-10 rounded-b-[2.5rem] shadow-2xl">
    <div class="flex items-center gap-6">
      <div class="bg-white p-2 rounded-2xl shadow-lg flex items-center justify-center">
        <img src="offken-logo.png" alt="Logo" class="h-[6vh] w-auto">
      </div>
      <div class="text-left">
        <h1 class="text-[3.5vh] font-black uppercase italic leading-none">OFF-KEN <span class="font-light not-italic">HEALTH</span></h1>
        <p id="mainStatus" class="text-offken-green text-[1.5vh] font-bold tracking-[0.4em] uppercase mt-1">Smart Terminal</p>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center relative px-6 py-2 z-20 overflow-hidden">
    
    <div id="idleState" class="w-full h-full flex flex-col items-center justify-center space-y-6">
      <h2 class="text-[8vh] font-black uppercase italic">Ready to Analyze?</h2>
      <button id="startBtn" class="bg-offken-green text-white px-20 py-8 rounded-[3.5rem] font-black text-[4.5vh] shadow-[0_0_60px_rgba(118,188,33,0.5)] uppercase italic">Tap to Start</button>
    </div>

    <div id="reader-container" class="hidden w-full max-w-xl text-center space-y-4">
      <h2 class="text-[4vh] font-black uppercase">Show QR Code</h2>
      <div class="relative rounded-[4rem] overflow-hidden border-[10px] border-white/5 aspect-square max-h-[45vh] mx-auto bg-black">
        <div id="reader" class="w-full h-full opacity-90"></div>
        <div class="absolute inset-x-0 top-0 h-2 bg-offken-green shadow-[0_0_20px_#76bc21] animate-[scan_3s_infinite_linear] z-[60]"></div>
      </div>
      <button id="cancelScanBtn" class="text-slate-500 font-black text-[3vh] uppercase">Cancel</button>
    </div>

    <div id="measurementState" class="hidden w-full max-w-5xl flex flex-col items-center space-y-4">
      <h2 id="patientName" class="text-[5vh] font-black italic uppercase">--</h2>
      
      <div id="generateSection" class="w-full py-8 bg-white/5 rounded-[3rem] border border-white/10 text-center">
        <p class="text-slate-300 text-[3vh] mb-6 italic">Station Ready. Stand Still.</p>
        <button id="generateBtn" class="bg-[#f3a107] text-white px-24 py-8 rounded-[2rem] font-black text-[4.5vh] uppercase shadow-xl active:scale-95 transition-all">Calculate Now</button>
      </div>

      <div id="loadingSection" class="hidden py-10 flex flex-col items-center space-y-8">
        <div class="w-[15vh] h-[15vh] border-[12px] border-offken-green border-t-transparent rounded-full animate-spin"></div>
        <p class="text-[5vh] text-offken-green font-black animate-pulse uppercase">Processing</p>
      </div>

      <div id="resultsSection" class="hidden w-full bg-slate-900/80 p-10 rounded-[4rem] border border-white/10 shadow-2xl">
        <div class="grid grid-cols-2 gap-x-12 gap-y-8">
          <div class="bg-white/5 p-6 rounded-[2rem]">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-widest">Weight</p>
            <p id="readout_weight" class="text-[9vh] font-black text-white leading-none">--<span class="text-[3vh] text-slate-500 ml-4">kg</span></p>
          </div>
          <div class="bg-white/5 p-6 rounded-[2rem]">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-widest">Heart Rate</p>
            <p id="readout_hr" class="text-[9vh] font-black text-rose-500 leading-none">--<span class="text-[3vh] text-slate-500 ml-4">bpm</span></p>
          </div>
          <div class="bg-white/5 p-6 rounded-[2rem]">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-widest">Activity</p>
            <p id="readout_steps" class="text-[9vh] font-black text-offken-green leading-none">--</p>
          </div>
          <div class="bg-white/5 p-6 rounded-[2rem]">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-widest">Sleep Quality</p>
            <p id="readout_sleep" class="text-[9vh] font-black text-blue-400 leading-none">--<span class="text-[3vh] text-slate-500 ml-4">%</span></p>
          </div>
        </div>
      </div>

      <div id="doneSection" class="hidden w-full flex flex-col items-center space-y-4 pb-4">
        <button id="doneBtn" class="bg-offken-green text-white px-32 py-8 rounded-[2.5rem] font-black text-[5vh] uppercase shadow-lg active:scale-95 transition-all">FINISH</button>
        <p id="countdownText" class="text-slate-500 font-mono text-[2vh] uppercase tracking-[0.6em]">Session ends in 60s</p>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="./js/scan.js"></script>
</body>
</html>
