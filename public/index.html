<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <title>Off-ken | Full Screen Terminal</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root { --offken-green: #76bc21; }
    
    .shinko-dark { background: #0f172a; }

    /* Video-like Pulse Background Animation */
    .pulse-container {
      position: absolute;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1;
      overflow: hidden;
      pointer-events: none;
    }
    .ring {
      position: absolute;
      border: 3px solid var(--offken-green);
      border-radius: 50%;
      animation: ripple 4s infinite ease-out;
      opacity: 0;
    }
    .ring:nth-child(2) { animation-delay: 1s; }
    .ring:nth-child(3) { animation-delay: 2s; }
    
    @keyframes ripple {
      0% { width: 100px; height: 100px; opacity: 0.6; }
      100% { width: 150vh; height: 150vh; opacity: 0; }
    }

    /* Scanner Laser Effect */
    @keyframes scan {
      0% { top: 0%; }
      50% { top: 100%; }
      100% { top: 0%; }
    }

    #reader video {
      object-fit: cover !important;
      width: 100% !important;
      height: 100% !important;
    }

    .bg-offken-green { background-color: var(--offken-green); }
    .text-offken-green { color: var(--offken-green); }
  </style>
</head>
<body class="shinko-dark h-screen w-screen flex flex-col font-sans overflow-hidden text-white">
  
  <div class="pulse-container">
    <div class="ring"></div>
    <div class="ring"></div>
    <div class="ring"></div>
  </div>

  <header class="h-[12vh] flex justify-center items-center z-50 bg-black/40 backdrop-blur-md border-b border-white/10 shrink-0 px-10">
    <div class="flex items-center gap-6">
      <div class="w-[8vh] h-[8vh] bg-white rounded-2xl flex items-center justify-center text-[5vh] shadow-xl shadow-green-500/20">🍎</div>
      <div class="text-left">
        <h1 class="text-[4vh] font-black tracking-tighter uppercase leading-none">OFF-KEN <span class="text-offken-green font-light">HEALTH</span></h1>
        <p id="mainStatus" class="text-slate-400 text-[1.5vh] font-bold tracking-[0.4em] uppercase mt-1">Smart Scale Terminal</p>
      </div>
    </div>
  </header>

  <main class="flex-1 flex flex-col items-center justify-center relative p-6 overflow-hidden z-20">
    
    <div id="idleState" class="w-full h-full flex flex-col items-center justify-center space-y-8">
      <div class="text-center space-y-4">
        <h2 class="text-[8vh] font-black uppercase tracking-tighter text-white drop-shadow-2xl">Ready to Analyze?</h2>
        <p class="text-[3vh] text-slate-400 font-medium italic">Step forward to begin your session</p>
      </div>
      <button id="startBtn" class="bg-offken-green text-white px-20 py-10 rounded-[3.5rem] font-black text-[5vh] hover:scale-105 active:scale-95 transition-all shadow-[0_0_60px_rgba(118,188,33,0.5)]">
        TAP TO START
      </button>
    </div>

    <div id="reader-container" class="hidden w-full max-w-xl text-center space-y-6">
      <h2 class="text-[4vh] font-black text-white uppercase tracking-tight">Show Your QR Code</h2>
      <div class="relative rounded-[4rem] overflow-hidden border-[12px] border-slate-800 shadow-2xl aspect-square max-h-[50vh] mx-auto bg-black">
        <div id="reader" class="w-full h-full"></div>
        <div class="absolute inset-x-0 top-0 h-1.5 bg-offken-green shadow-[0_0_20px_#76bc21] animate-[scan_3s_infinite_linear] z-[60]"></div>
      </div>
      <button id="cancelScanBtn" class="text-slate-500 font-black text-[3vh] hover:text-red-500 transition-all uppercase tracking-widest">Back</button>
    </div>

    <div id="measurementState" class="hidden w-full max-w-5xl space-y-8 text-center">
      <h2 id="patientName" class="text-[6vh] font-black text-white tracking-tighter uppercase italic leading-none">--</h2>

      <div id="generateSection" class="py-8 bg-white/5 rounded-[3rem] border border-white/10 backdrop-blur-sm">
        <p class="text-slate-400 text-[3vh] mb-6 font-light italic">Station Ready. Stand in position.</p>
        <button id="generateBtn" class="bg-white text-black px-24 py-8 rounded-3xl font-black text-[4vh] shadow-2xl hover:bg-slate-200 transition-all uppercase">
          Calculate Now
        </button>
      </div>

      <div id="loadingSection" class="hidden py-16 flex flex-col items-center space-y-10">
        <div class="w-[18vh] h-[18vh] border-[14px] border-offken-green border-t-transparent rounded-full animate-spin"></div>
        <p class="text-[6vh] text-offken-green font-black animate-pulse uppercase tracking-[0.5em]">Processing</p>
      </div>

      <div id="resultsSection" class="hidden bg-slate-900/60 p-12 rounded-[4rem] text-left border border-white/10 shadow-3xl relative overflow-hidden">
        <div class="grid grid-cols-2 gap-x-16 gap-y-10">
          <div class="space-y-2">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-[0.4em]">Weight</p>
            <p id="readout_weight" class="text-[9vh] font-black text-white leading-none tracking-tighter">--<span class="text-[3vh] text-slate-500 ml-4">kg</span></p>
          </div>
          <div class="space-y-2">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-[0.4em]">Heart Rate</p>
            <p id="readout_hr" class="text-[9vh] font-black text-rose-500 leading-none tracking-tighter">--<span class="text-[3vh] text-slate-500 ml-4">bpm</span></p>
          </div>
          <div class="space-y-2 border-t border-white/10 pt-4">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-[0.4em]">Activity</p>
            <p id="readout_steps" class="text-[9vh] font-black text-emerald-400 leading-none tracking-tighter">--<span class="text-[3vh] text-slate-500 ml-4">steps</span></p>
          </div>
          <div class="space-y-2 border-t border-white/10 pt-4">
            <p class="text-[1.8vh] text-slate-500 font-bold uppercase tracking-[0.4em]">Sleep Quality</p>
            <p id="readout_sleep" class="text-[9vh] font-black text-blue-400 leading-none tracking-tighter">--<span class="text-[3vh] text-slate-500 ml-4">%</span></p>
          </div>
        </div>
      </div>

      <div id="doneSection" class="hidden pt-4 flex flex-col items-center space-y-4">
        <button id="doneBtn" class="bg-offken-green text-white px-40 py-8 rounded-[3rem] font-black text-[5vh] shadow-2xl active:scale-95 transition-all">
          FINISH
        </button>
        <p id="countdownText" class="text-slate-500 font-mono text-[2.5vh] tracking-[0.7em] uppercase">Auto-Reset in 60s</p>
      </div>
    </div>
  </main>

  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="./js/scan.js"></script>
</body>
</html>
